<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sign up</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: Arial; background: #f4f5f7; padding: 40px; }
  form { background: white; max-width: 420px; margin: 0 auto; padding: 32px; border-radius: 8px; }
  input { display: block; width: 100%; padding: 10px; margin: 12px 0; border: 1px solid #ccc; border-radius: 6px; }
  button { background: #2f6fed; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
  .error { color: #d64545; margin: 12px 0; }
  .danger-zone { max-width: 420px; margin: 24px auto; background: white; padding: 32px; border-radius: 8px; }
</style>
</head>
<body>
  <form action="/signup" method="post">
    <h1>Create your account</h1>
    <input type="email" name="email" placeholder="Email">
    <input type="password" name="password" placeholder="Password">
    <div class="error">Something went wrong</div>
    <button type="submit">Submit</button>
  </form>
  <div class="danger-zone">
    <h2>Delete account</h2>
    <p>Type DELETE to confirm. This permanently removes all projects and cannot be undone.</p>
    <input type="text" id="confirm-delete" placeholder="Type DELETE">
    <button id="delete-btn" disabled>Delete my account</button>
  </div>
  <script>
    const box = document.getElementById('confirm-delete');
    const btn = document.getElementById('delete-btn');
    box.addEventListener('input', () => { btn.disabled = box.value !== 'DELETE'; });
  </script>
</body>
</html>

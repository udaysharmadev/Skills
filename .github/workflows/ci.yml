name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default-deny: jobs get no token scopes unless they declare their own.
permissions:
  contents: read

# Cancel superseded runs on the same ref so stale greens cannot land later.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: deterministic checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: validate-skills
        run: scripts/validate-skills
      - name: check-names
        run: scripts/check-names
      - name: check-links
        run: scripts/check-links
      - name: validate-frontmatter
        run: scripts/validate-frontmatter
      - name: check-claims
        run: scripts/check-claims
      - name: check-readme-sync
        run: scripts/check-readme-sync
      - name: regression tests
        run: scripts/test-regressions
      - name: evaluation integrity regressions
        run: scripts/test-upgrade
      - name: standalone packages
        run: scripts/check-packages
      - name: Node for deterministic domain models
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: offline and replay models
        run: scripts/test-archetypes
      - name: retained local demonstrations
        run: scripts/check-demos
      - name: eval fixtures well-formed
        run: scripts/run-evals
      - name: generated docs up to date
        run: |
          scripts/build-docs
          git diff --exit-code docs/skills/INDEX.md \
            || (echo "::error::docs/skills/INDEX.md is stale — run scripts/build-docs" && exit 1)
      - name: context budget audit
        run: scripts/check-context

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agent to evaluate'
        required: true
        default: codex

jobs:
  deterministic:
    name: deterministic checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate-skills
        run: scripts/validate-skills
      - name: check-names
        run: scripts/check-names
      - name: check-links
        run: scripts/check-links
      - name: eval fixtures well-formed
        run: scripts/run-evals
      - name: generated docs up to date
        run: |
          scripts/build-docs
          git diff --exit-code docs/skills/INDEX.md \
            || (echo "::error::docs/skills/INDEX.md is stale — run scripts/build-docs" && exit 1)
      - name: context budget audit
        run: scripts/check-context

  # Live agent evals cost money and need secrets — manual dispatch only,
  # never on PRs, never from forks (secrets unavailable to forks anyway).
  live-eval:
    name: live agent eval (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: deterministic
    runs-on: ubuntu-latest
    strategy:
      matrix:
        agent: [codex, opencode]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install agent cli
        run: |
          echo "SCAFFOLDING: per-agent CLI installation requires vendor-specific"
          echo "setup + auth secrets. Wire before enabling this job for real runs."
      - name: trigger eval
        env:
          AGENT: ${{ matrix.agent }}
        run: scripts/eval-trigger --agent "$AGENT" --tier smoke --json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ matrix.agent }}
          path: evals/results/
